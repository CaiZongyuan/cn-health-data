[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cn-health-compiler"
version = "0.1.0"
description = "Build-time compiler for CN Health reference datasets"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "cryptography>=46,<47",
    "jsonschema[format]>=4.24,<5",
    "openpyxl>=3.1.5,<4",
    "polars>=1.34,<2",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.2,<7",
    "rfc8785>=0.1.4,<1",
    "typer>=0.16,<1",
    "ucumvert>=0.3.2,<0.4",
    "zstandard>=0.25,<1",
]

[project.scripts]
cn-health-build = "cn_health_compiler.cli:app"
cn-health-synthea-service = "cn_health_compiler.synthetic.synthea_service:main"
cn-health-synthea-runtime = "cn_health_compiler.synthetic.synthea_runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cn_health_compiler"]
