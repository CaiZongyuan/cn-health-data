[workspace]
members = ["rust/cn-health"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0"
fs2 = "0.4"
hex = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
zstd = "0.13"
